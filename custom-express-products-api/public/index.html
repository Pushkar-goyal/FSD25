<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Custom Product Store</title>
  <link rel="stylesheet" href="/public/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon">✦</span>
        <span class="brand-name">Storefront</span>
      </div>

      <div class="sidebar-section">
        <h3>Categories</h3>
        <div id="categoryList" class="category-list"></div>
      </div>

      <div class="sidebar-section">
        <h3>Price Range</h3>
        <div class="price-filter">
          <label for="minPrice">Min</label>
          <input type="number" id="minPrice" min="0" value="0" />
          <label for="maxPrice">Max</label>
          <input type="number" id="maxPrice" min="0" value="500" />
        </div>
      </div>

      <div class="sidebar-section">
        <button id="applyFilters" class="primary-button">Apply Filters</button>
      </div>
    </aside>

    <main class="main-content">
      <section class="topbar">
        <div>
          <span class="kicker">Product Catalog</span>
          <h1>All Products</h1>
        </div>
        <div class="topbar-actions">
          <input type="search" id="searchInput" placeholder="Search products..." />
          <button id="searchButton" class="primary-button">Search</button>
        </div>
      </section>

      <section class="stats-grid">
        <article class="stat-card">
          <span class="stat-label">Total Products</span>
          <span class="stat-value" id="totalProducts">0</span>
        </article>
        <article class="stat-card">
          <span class="stat-label">Average Price</span>
          <span class="stat-value" id="avgPrice">$0</span>
        </article>
        <article class="stat-card">
          <span class="stat-label">Categories</span>
          <span class="stat-value" id="categoriesCount">0</span>
        </article>
        <article class="stat-card">
          <span class="stat-label">Total Stock</span>
          <span class="stat-value" id="totalStock">0</span>
        </article>
      </section>

      <section class="product-section">
        <div class="product-toolbar">
          <div class="toolbar-title">
            <span id="resultCount">0</span> products found
          </div>
          <div class="toolbar-controls">
            <select id="sortBy">
              <option value="id">Sort: ID</option>
              <option value="price">Sort: Price</option>
              <option value="rating">Sort: Rating</option>
              <option value="title">Sort: Title</option>
            </select>
            <select id="sortOrder">
              <option value="asc">Ascending</option>
              <option value="desc">Descending</option>
            </select>
          </div>
        </div>

        <div id="productGrid" class="product-grid"></div>

        <div class="pagination">
          <button id="prevPage" class="secondary-button">Previous</button>
          <span id="pageInfo">Page 1</span>
          <button id="nextPage" class="secondary-button">Next</button>
        </div>
      </section>
    </main>
  </div>

  <script src="/public/app.js" defer></script>
</body>
</html>
</html>
